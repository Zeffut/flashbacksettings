name: Gradle 26.3 Fabric

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "port/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-26_3-fabric:
    name: Build 26.3 Fabric (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Minecraft 26.3 Fabric
        run: ./gradlew :26.3-fabric:clean :26.3-fabric:build :26.3-fabric:test --stacktrace --no-daemon

      - name: Upload remapped mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flashbacksettings-26.3-fabric
          path: |
            versions/26.3-fabric/build/libs/*-fabric-*.jar
            !versions/26.3-fabric/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
