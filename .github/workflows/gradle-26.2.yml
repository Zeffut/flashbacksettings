name: Gradle Fabric

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "port/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build ${{ matrix.minecraft }} Fabric (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.1.2"
            java: "25"
          - minecraft: "26.2"
            java: "25"
          - minecraft: "26.3"
            java: "25"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Minecraft ${{ matrix.minecraft }} Fabric
        run: ./gradlew :${{ matrix.minecraft }}-fabric:clean :${{ matrix.minecraft }}-fabric:build :${{ matrix.minecraft }}-fabric:test --stacktrace --no-daemon

      - name: Upload remapped mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flashbacksettings-${{ matrix.minecraft }}-fabric
          path: |
            versions/${{ matrix.minecraft }}-fabric/build/libs/*-fabric-*.jar
            !versions/${{ matrix.minecraft }}-fabric/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
